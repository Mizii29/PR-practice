<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>猜数字游戏</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; margin: 0; background: #f0f2f5;
  }
  .box {
    background: #fff; padding: 30px; border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,.1);
    text-align: center; width: 320px;
  }
  h1 { font-size: 20px; margin: 0 0 10px; }
  input {
    width: 100px; padding: 8px; font-size: 16px;
    text-align: center; border: 1px solid #ccc; border-radius: 6px;
  }
  button {
    padding: 8px 16px; font-size: 16px; border: none;
    border-radius: 6px; background: #1677ff; color: #fff; cursor: pointer;
  }
  button:hover { background: #0958d9; }
  #msg { margin: 15px 0; min-height: 24px; font-size: 16px; }
  #info { color: #888; font-size: 14px; }
  .win  { color: #52c41a; font-weight: bold; }
  .lose { color: #ff4d4f; font-weight: bold; }
  .hint { color: #fa8c16; }
</style>
</head>
<body>
<div class="box">
  <h1>猜数字游戏</h1>
  <p id="info"></p>
  <div id="msg"></div>
  <input id="guess" type="number" min="1" max="100" placeholder="输入数字">
  <button id="btn">猜！</button>
</div>

<script>
  let answer, left, over;

  const $msg   = document.getElementById('msg');
  const $info  = document.getElementById('info');
  const $input = document.getElementById('guess');
  const $btn   = document.getElementById('btn');

  function newGame() {
    answer = Math.floor(Math.random() * 100) + 1; // 1~100 随机数
    left = 8;      // 剩余次数
    over = false;

    $input.value = '';
    $input.disabled = false;
    $btn.textContent = '猜！';
    $btn.onclick = guess;
    $msg.textContent = '';
    $msg.className = '';
    $info.textContent = '1~100 之间的数字，你有 8 次机会。剩余：8 次';
    $input.focus();
  }

  function guess() {
    if (over) return;

    const v = Number($input.value);
    if (!Number.isInteger(v) || v < 1 || v > 100) {
      $msg.textContent = '请输入 1~100 的整数';
      $msg.className = 'hint';
      return;
    }

    left--;
    $input.value = '';
    $input.focus();

    if (v === answer) {
      $msg.textContent = `🎉 猜对了！答案就是 ${answer}，你用了 ${8 - left} 次。`;
      $msg.className = 'win';
      endGame();
    } else if (left === 0) {
      $msg.textContent = `😢 机会用完了，答案是 ${answer}。`;
      $msg.className = 'lose';
      endGame();
    } else {
      $msg.textContent = v < answer
        ? `太小了 ⬆️ 还剩 ${left} 次`
        : `太大了 ⬇️ 还剩 ${left} 次`;
      $msg.className = 'hint';
      $info.textContent = `剩余：${left} 次`;
    }
  }

  function endGame() {
    over = true;
    $input.disabled = true;
    $btn.textContent = '再玩一次';
    $btn.onclick = newGame;
    $info.textContent = '';
  }

  // 回车也能提交
  $input.addEventListener('keydown', e => {
    if (e.key === 'Enter') $btn.click();
  });

  newGame(); // 启动游戏
</script>
</body>
</html>
